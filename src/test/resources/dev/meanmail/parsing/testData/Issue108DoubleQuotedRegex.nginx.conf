# https://github.com/meanmail-dev/nginx-intellij-plugin/issues/108
# Double-quoted values must not be reported as syntax errors in any context.
# These exercise the DQSTRING_STATE (map block) and IF_DQSTRING_STATE (if condition) lexer states.
map $http_user_agent $is_bot {
    default            0;
    "~Mozilla/[123]\." 1;
}

server {
    if ($request_uri ~* "^(.*/)index\.php$") {
        return 403;
    }
}
